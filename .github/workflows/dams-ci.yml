name: Dams CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370"

      - name: Set NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build native tunnel
        run: bash compile-hevtun.sh

      - name: Download pinned Xray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          curl --fail --location --retry 3 \
            -o V2rayNG/app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.1.23/libv2ray.aar
          test "$(sha256sum V2rayNG/app/libs/libv2ray.aar | cut -d' ' -f1)" = \
            17387858d760b6a24b7dc3805eaf8554fe5041f5356945e637fdcbe3cea455fa
          cp -r libs V2rayNG/app/

      - name: Check native libraries
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -f "V2rayNG/app/libs/$abi/libhev-socks5-tunnel.so"
            test -f "V2rayNG/app/libs/$abi/libhevsockstun.so"
          done
          unzip -l V2rayNG/app/libs/libv2ray.aar | grep -q 'jni/arm64-v8a/libgojni.so'

      - name: Run tests and lint
        working-directory: V2rayNG
        run: ./gradlew testPlaystoreDebugUnitTest lintPlaystoreDebug

      - name: Build standard debug and release APKs for demo isolation checks
        working-directory: V2rayNG
        run: ./gradlew :app:assemblePlaystoreDebug :app:assemblePlaystoreRelease

      - name: Build isolated Premium test APK (debug signing only)
        working-directory: V2rayNG
        run: ./gradlew :app:assemblePlaystorePremiumTest -PpremiumDemoMode=true

      - name: Verify demonstration code exists only in the TEST APK
        shell: bash
        run: |
          set -euo pipefail
          contains_test_demo() {
            local apk="$1"
            if unzip -p "$apk" resources.arsc | strings | grep -Eq \
              'simulated subscription data|données d’abonnement simulées|Simulate active subscription|Simuler un abonnement actif'; then
              return 0
            fi
            while IFS= read -r dex; do
              if unzip -p "$apk" "$dex" | strings | grep -Eq \
                'Lcom/v2ray/ang/premiumtest/PremiumTestVariantExtension;|Lcom/v2ray/ang/premium/PremiumDemoSubscriptionDataSource;|Lcom/v2ray/ang/premium/PremiumDemoScenario;|premium_demo_(build_notice|active|expired|quota)'; then
                return 0
              fi
            done < <(unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?\.dex$' || true)
            return 1
          }

          test_apk="$(find V2rayNG/app/build/outputs/apk/playstore/premiumTest -name '*.apk' -print -quit)"
          test -n "$test_apk"
          contains_test_demo "$test_apk"

          for variant in debug release; do
            apk="$(find "V2rayNG/app/build/outputs/apk/playstore/$variant" -name '*.apk' -print -quit)"
            test -n "$apk"
            if contains_test_demo "$apk"; then
              echo "Test-only demonstration implementation leaked into $variant APK: $apk" >&2
              exit 1
            fi
          done

      - name: Upload isolated Premium test APK
        uses: actions/upload-artifact@v4
        with:
          name: dams-premium-test-apk
          path: V2rayNG/app/build/outputs/apk/playstore/premiumTest/*.apk
          if-no-files-found: error
          retention-days: 7
