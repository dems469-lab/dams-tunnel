name: Dams APK

on:
  workflow_dispatch:
  push:
    branches: ["phase-*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370"

      - name: Set NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build native tunnel
        run: bash compile-hevtun.sh

      - name: Download pinned Xray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          curl --fail --location --retry 3 \
            -o V2rayNG/app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.10/libv2ray.aar
          test "$(sha256sum V2rayNG/app/libs/libv2ray.aar | cut -d' ' -f1)" = \
            15db760bfbc24c0492ee997784b48a7b5e1bc5032950d617cd252fc2195f7ac7
          cp -r libs V2rayNG/app/

      - name: Build debug APK
        working-directory: V2rayNG
        run: ./gradlew assemblePlaystoreDebug

      - name: Verify APK contents
        run: |
          find V2rayNG/app/build/outputs/apk -name '*.apk' -print
          test -n "$(find V2rayNG/app/build/outputs/apk -name '*.apk' -print -quit)"
          find V2rayNG/app/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            echo "=== $apk ==="
            unzip -l "$apk" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/(libhev|libgojni)' || true
            case "$apk" in
              *arm64-v8a*) abis="arm64-v8a" ;;
              *armeabi-v7a*) abis="armeabi-v7a" ;;
              *x86_64*) abis="x86_64" ;;
              *x86*) abis="x86" ;;
              *universal*) abis="arm64-v8a armeabi-v7a x86 x86_64" ;;
              *) echo "Unknown ABI in $apk"; exit 1 ;;
            esac
            for abi in $abis; do
              unzip -l "$apk" | grep -q "lib/$abi/libhev-socks5-tunnel.so" || {
                echo "Missing libhev-socks5-tunnel.so for $abi in $apk"; exit 1;
              }
              unzip -l "$apk" | grep -q "lib/$abi/libgojni.so" || {
                echo "Missing libgojni.so for $abi in $apk"; exit 1;
              }
            done
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dams-debug-apks
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
