name: Dams APK

on:
  workflow_dispatch:
  push:
    branches: ["phase-*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Signature de publication non configurée::Le secret GitHub $secret_name est absent ou vide. Suivez .github/KEYSTORE_SETUP.md, puis relancez le workflow."
              exit 1
            fi
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370"

      - name: Set NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build native tunnel
        run: bash compile-hevtun.sh

      - name: Download pinned Xray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          curl --fail --location --retry 3 \
            -o V2rayNG/app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.1.23/libv2ray.aar
          test "$(sha256sum V2rayNG/app/libs/libv2ray.aar | cut -d' ' -f1)" = \
            17387858d760b6a24b7dc3805eaf8554fe5041f5356945e637fdcbe3cea455fa
          cp -r libs V2rayNG/app/

      - name: Build signed release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: V2rayNG
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/dams-release.jks"
          trap 'shred -u "$keystore" 2>/dev/null || rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if ! keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Keystore invalide::Le keystore, son mot de passe ou l'alias ne peut pas être validé. Vérifiez les secrets GitHub."
            exit 1
          fi
          export KEYSTORE_PATH="$keystore"
          ./gradlew assemblePlaystoreRelease

      - name: Verify APK contents
        run: |
          find V2rayNG/app/build/outputs/apk -name '*.apk' -print
          test -n "$(find V2rayNG/app/build/outputs/apk -name '*.apk' -print -quit)"
          find V2rayNG/app/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            echo "=== $apk ==="
            unzip -l "$apk" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/(libhev|libgojni)' || true
            case "$apk" in
              *arm64-v8a*) abis="arm64-v8a" ;;
              *armeabi-v7a*) abis="armeabi-v7a" ;;
              *x86_64*) abis="x86_64" ;;
              *x86*) abis="x86" ;;
              *universal*) abis="arm64-v8a armeabi-v7a x86 x86_64" ;;
              *) echo "Unknown ABI in $apk"; exit 1 ;;
            esac
            for abi in $abis; do
              unzip -l "$apk" | grep -q "lib/$abi/libhev-socks5-tunnel.so" || {
                echo "Missing libhev-socks5-tunnel.so for $abi in $apk"; exit 1;
              }
              unzip -l "$apk" | grep -q "lib/$abi/libgojni.so" || {
                echo "Missing libgojni.so for $abi in $apk"; exit 1;
              }
            done
          done

      - name: Display APK signing certificate SHA-256 fingerprints
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          find V2rayNG/app/build/outputs/apk -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            echo "Certificate SHA-256 fingerprint for $apk:"
            "$apksigner" verify --print-certs "$apk" \
              | grep -E 'certificate SHA-256 digest:'
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dams-release-apks
          path: V2rayNG/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload APK universel séparément
        uses: actions/upload-artifact@v4
        with:
          name: dams-universal-apk
          path: V2rayNG/app/build/outputs/apk/playstore/release/*_universal.apk
          if-no-files-found: error

      - name: Upload APK arm64 séparément
        uses: actions/upload-artifact@v4
        with:
          name: dams-arm64-apk
          path: V2rayNG/app/build/outputs/apk/playstore/release/*_arm64-v8a.apk
          if-no-files-found: error
