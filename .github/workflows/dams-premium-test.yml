name: Dams Premium Test APK

on:
  workflow_dispatch:
    inputs:
      test_domain:
        description: HTTPS base URL for the internal test subscription server
        required: true
        type: string
      demo_mode:
        description: Use simulated subscription states without network access
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  premium-test-apk:
    name: Internal Premium test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build native tunnel
        run: bash compile-hevtun.sh

      - name: Download pinned Xray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          curl --fail --location --retry 3 \
            -o V2rayNG/app/libs/libv2ray.aar \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.1.23/libv2ray.aar
          test "$(sha256sum V2rayNG/app/libs/libv2ray.aar | cut -d' ' -f1)" = \
            17387858d760b6a24b7dc3805eaf8554fe5041f5356945e637fdcbe3cea455fa
          cp -r libs V2rayNG/app/

      - name: Validate test domain
        env:
          TEST_DOMAIN: ${{ inputs.test_domain }}
        run: |
          if [[ ! "$TEST_DOMAIN" =~ ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/?$ ]]; then
            echo "test_domain must be an HTTPS origin (host and optional port only)." >&2
            exit 1
          fi

      - name: Build isolated internal TEST APK
        working-directory: V2rayNG
        env:
          TEST_DOMAIN: ${{ inputs.test_domain }}
          DEMO_MODE: ${{ inputs.demo_mode }}
        run: |
          ./gradlew --no-daemon :app:assemblePlaystorePremiumTest \
            -PpremiumDebugBaseUrl="$TEST_DOMAIN" \
            -PpremiumDemoMode="$DEMO_MODE"

      - name: Mark APK as internal test build
        run: |
          mkdir -p artifacts/premium-test
          find V2rayNG/app/build/outputs/apk/playstore/premiumTest -maxdepth 1 -name '*universal.apk' -print -quit \
            | xargs -r -I '{}' cp '{}' artifacts/premium-test/dams-tunnel-premium-test.apk
          test -s artifacts/premium-test/dams-tunnel-premium-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dams-premium-test-apk
          path: artifacts/premium-test/dams-tunnel-premium-test.apk
          if-no-files-found: error
          retention-days: 7
